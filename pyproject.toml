[build-system]
requires = ["setuptools>=77"]  # 77: the license as an SPDX expression
build-backend = "setuptools.build_meta"

[project]
name = "localchat"
version = "0.1.0"
description = "Local AI ecosystem: a hub for projects, terminals, models and agents, plus a light Qt app"
readme = "README.md"
license = "GPL-3.0-or-later"  # the user's word 2026-11-04
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = []

[project.optional-dependencies]
hub = [
    "fastapi>=0.162", "uvicorn>=0.54", "websockets>=17", "httpx>=0.28", "anthropic>=2.3", "keyring>=25.7",
    "psutil>=7.2", "watchdog>=6.0", "pywinpty>=3.1",  # stage 2: processes and ports, file watching, terminals
    # stage 3: the symbol index (D26) - the parser and the official grammars with their tags queries
    "tree-sitter>=0.26", "tree-sitter-python>=0.25", "tree-sitter-javascript>=0.25", "tree-sitter-typescript>=0.23",
    "tree-sitter-go>=0.25", "tree-sitter-rust>=0.24", "tree-sitter-java>=0.23", "tree-sitter-c-sharp>=0.23",
    "tree-sitter-c>=0.24", "tree-sitter-cpp>=0.23",
    "mcp>=2.3",  # stage 4: the hub's MCP server (D32), the official SDK
    "comtypes>=1.4",  # stage 9.6: Windows UI Automation for the agent at the desktop (D41)
    "pypdf>=6.21",  # 2026-10-29: the text of a PDF sent with a message (hub/attachments.py)
]
app = ["PySide6-Essentials>=6.12", "httpx>=0.28", "websockets>=17", "markdown-it-py>=4.0", "pygments>=2.21", "pyte>=0.8"]
dev = ["ruff>=0.14", "pytest>=8.4", "httpx2>=2.16", "pip-audit>=2.9"]  # httpx2: what Starlette's TestClient wants now
# the exact versions it is built and tested with: requirements.lock (D46)

[tool.setuptools.packages.find]
include = ["hub*", "app*", "common*"]

[tool.setuptools.package-data]
"hub" = ["model_catalog.json", "proving_tasks/*/task.json", "proving_tasks/*/files/**/*", "proving_tasks/*/exam/*"]
"hub.db" = ["migrations/*.sql"]
"common" = ["locale/*.json"]
"app.ui" = ["qml/*.qml", "icons/*.svg", "icons/*.txt", "fonts/*.ttf", "fonts/*.txt"]

[tool.ruff]
line-length = 120
target-version = "py314"
extend-exclude = ["data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# the user-facing text is Russian: Cyrillic letters that look Latin are intended, not typos
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not stress'"  # the stress stand runs on its own: pytest -m stress (tests/stress, D46)
markers = ["stress: the stress stand - big synthetic data, numbers at the end (tests/stress)"]
