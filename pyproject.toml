[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "localchat"
version = "0.0.1"
description = "Local AI ecosystem: a hub for projects, terminals, models and agents, plus a light Qt app"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[project.optional-dependencies]
hub = ["fastapi>=0.162", "uvicorn>=0.54", "websockets>=17", "httpx>=0.28", "anthropic>=2.3", "keyring>=25.7"]
app = ["PySide6-Essentials>=6.12", "httpx>=0.28", "websockets>=17", "markdown-it-py>=4.0", "pygments>=2.21"]
dev = ["ruff>=0.14", "pytest>=8.4", "httpx2>=2.16"]  # httpx2: what Starlette's TestClient wants now

[tool.setuptools.packages.find]
include = ["hub*", "app*", "common*"]

[tool.setuptools.package-data]
"hub.db" = ["migrations/*.sql"]
"app.ui" = ["qml/*.qml"]

[tool.ruff]
line-length = 120
target-version = "py314"
extend-exclude = ["localchat", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# the user-facing text is Russian: Cyrillic letters that look Latin are intended, not typos
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
